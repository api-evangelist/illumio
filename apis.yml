aid: illumio
name: Illumio
description: >-
  Illumio is a Zero Trust Segmentation (microsegmentation) cybersecurity company
  whose platform stops the lateral spread of ransomware and breaches across data
  centers, cloud, and endpoints. Its Policy Compute Engine (PCE) exposes a REST
  API (base path /api/v2) for programmatically managing workloads, labels,
  security policy, rulesets, IP lists, virtual services, enforcement boundaries,
  and for querying traffic/flow (Illumination) data. Products include Illumio
  Core for host-based data center and cloud workload segmentation, Illumio
  CloudSecure for agentless public-cloud segmentation, and Illumio Endpoint. The
  API is authenticated with an organization-scoped API key (key ID + secret over
  HTTP Basic) and is accompanied by an official Python REST client, Terraform
  providers for Illumio Core and CloudSecure, and a certified Ansible collection.
